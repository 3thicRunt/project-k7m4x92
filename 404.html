<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - CIMA EquipmentHUB</title>
    <link rel="icon" href="icons/cimalg.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="images/cimalogo.png" alt="CIMA Logo">
            </a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content error-content">
                <span class="error-code">404</span>
                <h1>Página Não Encontrada</h1>
                <p>A página que procura não existe ou foi movida. Verifique o endereço ou volte à página inicial.</p>
                <a href="index.html" class="submit-btn">Voltar ao Início</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logos">
                <img src="images/cimafooter_preto.png" alt="CIMA" class="logo-light">
                <img src="images/cimafooter_branco.png" alt="CIMA" class="logo-dark">
                <img src="images/arnetfooter_preto.png" alt="ARNET" class="logo-light">
                <img src="images/arnetfooter_branco.png" alt="ARNET" class="logo-dark">
                <img src="images/ualgfooter_preto.png" alt="Universidade do Algarve" class="logo-light">
                <img src="images/ualgfooter_branco.png" alt="Universidade do Algarve" class="logo-dark">
            </div>
            <div class="footer-year">
                <p>© 2026</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
